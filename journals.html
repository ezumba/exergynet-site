<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExergyNet Journal | Persistent Machine Intelligence</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="shortcut icon" href="assets/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="description" content="Zero-knowledge proofs, persistent AI infrastructure, and the architecture of verifiable autonomous systems. Insights from the ExergyNet team.">
<meta property="og:title" content="ExergyNet Journal">
<meta property="og:description" content="Insights on zero-knowledge proofs, persistent AI infrastructure, and the architecture of verifiable autonomous systems.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://exergynet.org/journals">
<link rel="stylesheet" href="style.css">
<script>
(function(){
  var t = localStorage.getItem('exg-theme');
  if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
/* ── Journal surface semantic tokens ─────────────────────────────────────────
   Scoped to the journal page so the fix can't affect the rest of the site.
   Dark values inherit the existing global palette (kept exactly as-is — dark
   mode is already correct). Light values are set explicitly because the global
   --text-faint (#8aabcc) has too little contrast on the white (--bg-card) cards;
   these light values all clear WCAG AA (>=4.5:1) on #ffffff. */
:root {
  --journal-title:   var(--text);
  --journal-sub:     var(--text-soft);
  --journal-excerpt: var(--text-faint);
  --journal-meta:    var(--text-faint);
}
:root[data-theme="light"] {
  --journal-title:   #0d2138; /* ~15:1 on #fff */
  --journal-sub:     #2f4d6b; /* ~8:1  */
  --journal-excerpt: #46617e; /* ~6.2:1 */
  --journal-meta:    #526c88; /* ~5.0:1 */
}

/* ── Journal page styles ─────────────────────────────────────────────────── */
.journal-hero {
  text-align: center;
  padding: 80px 24px 56px;
  max-width: 680px;
  margin: 0 auto;
}
.journal-hero-eyebrow {
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 16px;
  font-family: 'Barlow Condensed', 'JetBrains Mono', monospace;
}
.journal-hero h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  color: var(--text);
  margin: 0 0 16px;
  line-height: 1.1;
}
.journal-hero h1 span { color: var(--accent); }
.journal-hero p {
  font-size: 16px;
  color: var(--text-soft);
  line-height: 1.65;
  margin: 0;
}

/* ── Tag filter strip ─────────────────────────────────────────────────────── */
.journal-tags {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  padding: 0 24px 48px;
}
.journal-tag-btn {
  font-size: 12px;
  padding: 6px 16px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-soft);
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: 'Barlow Condensed', sans-serif;
  letter-spacing: 0.06em;
  text-transform: capitalize;
}
.journal-tag-btn:hover,
.journal-tag-btn.active {
  border-color: var(--accent);
  background: rgba(0, 232, 135, 0.07);
  color: var(--accent);
}

/* ── Article grid ─────────────────────────────────────────────────────────── */
.journal-grid-wrap {
  max-width: 1140px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* Featured card */
.journal-featured {
  margin-bottom: 48px;
}
.journal-featured-card {
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  text-decoration: none;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.journal-featured-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
}
.journal-featured-card.no-cover {
  grid-template-columns: 1fr;
}
.journal-featured-img {
  position: relative;
  min-height: 340px;
  background: var(--bg-card);
  overflow: hidden;
}
.journal-featured-img img {
  width: 100%; height: 100%;
  object-fit: cover; position: absolute; inset: 0;
}
.journal-featured-body {
  padding: 44px 44px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 14px;
}
.journal-tag-chips { display: flex; gap: 7px; flex-wrap: wrap; }
.journal-tag-chip {
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  background: rgba(0, 232, 135, 0.09);
  padding: 3px 9px;
  border-radius: 4px;
  border: 1px solid rgba(0,232,135,0.2);
}
.journal-featured-title {
  font-size: clamp(1.25rem, 2.5vw, 1.75rem);
  font-weight: 800;
  line-height: 1.2;
  color: var(--journal-title);
  letter-spacing: -0.025em;
  margin: 0;
}
.journal-featured-sub {
  font-size: 15px;
  color: var(--journal-sub);
  line-height: 1.6;
  margin: 0;
}
.journal-featured-excerpt {
  font-size: 13px;
  color: var(--journal-excerpt);
  line-height: 1.7;
  margin: 0;
}
.journal-byline {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.journal-byline-dot { color: var(--border); font-size: 12px; }
.journal-byline span {
  font-size: 12px;
  color: var(--journal-meta);
}

/* Card grid */
.journal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 22px;
}
.journal-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  text-decoration: none;
  display: flex;
  flex-direction: column;
  transition: border-color 0.2s ease, transform 0.2s ease;
}
.journal-card:hover {
  border-color: var(--accent);
  transform: translateY(-3px);
}
.journal-card-img {
  height: 180px;
  background: var(--bg-card);
  position: relative;
  overflow: hidden;
  flex-shrink: 0;
}
.journal-card-img img { width: 100%; height: 100%; object-fit: cover; }
.journal-card-placeholder {
  height: 120px;
  background: linear-gradient(135deg, var(--bg-card) 0%, #0d1526 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.journal-card-placeholder-icon {
  font-size: 26px;
  opacity: 0.1;
  color: var(--accent);
}
.journal-card-body {
  padding: 20px 22px 22px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.journal-card-title {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--journal-title);
  letter-spacing: -0.01em;
  margin: 0;
}
.journal-card-excerpt {
  font-size: 13px;
  color: var(--journal-excerpt);
  line-height: 1.65;
  margin: 0;
  flex: 1;
}
.journal-card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px solid var(--border-mid);
  margin-top: auto;
}
.journal-card-meta span {
  font-size: 11px;
  color: var(--journal-meta);
}
.journal-card-meta-dot { color: var(--border); }

/* Controls row: tag filters + sort */
.journal-controls-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  padding: 0 24px 36px;
  max-width: 1100px;
  margin: 0 auto;
}
.journal-sort-select {
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-card, transparent);
  color: var(--text-soft);
  cursor: pointer;
}

/* Load more */
.journal-loadmore-wrap {
  display: flex;
  justify-content: center;
  margin-top: 52px;
}
.journal-loadmore-btn {
  font-size: 13px;
  padding: 10px 28px;
  border-radius: 24px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s ease;
}
.journal-loadmore-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* Loading / empty */
.journal-loading {
  text-align: center;
  padding: 80px 24px;
  color: var(--text-faint);
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}
.journal-empty {
  text-align: center;
  padding: 80px 24px;
}
.journal-empty-icon {
  font-size: 40px;
  opacity: 0.12;
  color: var(--accent);
  margin-bottom: 16px;
}
.journal-empty p {
  color: var(--text-faint);
  font-size: 14px;
}

/* Responsive */
@media (max-width: 768px) {
  .journal-featured-card {
    grid-template-columns: 1fr;
  }
  .journal-featured-img {
    min-height: 220px;
  }
  .journal-featured-body {
    padding: 28px 24px;
  }
}
</style>
</head>
<body>
<div id="nav-container"></div>

<main>

  <!-- Hero -->
  <div class="journal-hero">
    <div class="journal-hero-eyebrow">ExergyNet Journal</div>
    <h1>Persistent Machine Intelligence,<br><span>In Print</span></h1>
    <p>Zero-knowledge proofs, persistent AI infrastructure,<br>and the architecture of verifiable autonomous systems.</p>
  </div>

  <!-- Tag filters + sort control -->
  <div class="journal-controls-row">
    <div class="journal-tags" id="tag-strip" style="padding:0;margin:0;justify-content:flex-start;">
      <button class="journal-tag-btn active" data-tag="">All tags</button>
    </div>
    <select id="sort-select" class="journal-sort-select">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
    </select>
  </div>

  <!-- Article grid -->
  <div class="journal-grid-wrap">
    <div id="journal-content">
      <div class="journal-loading">loading articles…</div>
    </div>
    <div class="journal-loadmore-wrap" id="loadmore-wrap" style="display:none;">
      <button class="journal-loadmore-btn" id="loadmore-btn">Load more</button>
    </div>
  </div>

</main>

<div id="footer-container"></div>

<script>
// ── Load nav + footer ──────────────────────────────────────────────────────
fetch('header.html').then(r => r.text()).then(h => {
  var el = document.getElementById('nav-container');
  if (el) { el.innerHTML = '<nav id="main-nav">' + h.replace(/^<!--.*?-->\s*/,'').replace(/^<nav[^>]*>/,'').replace(/<\/nav>\s*$/,'') + '</nav>'; }
  if (window.initNav) window.initNav();
});
fetch('footer.html').then(r => r.text()).then(h => {
  var el = document.getElementById('footer-container');
  if (el) el.innerHTML = h;
});

// ── State ──────────────────────────────────────────────────────────────────
var PAGE_SIZE = 12;
var state = { tag: '', sort: 'newest', loaded: 0, total: 0, hasMore: false, articles: [] };
var knownTags = new Set();

function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}

function coverSrc(url) {
  // cover_url is stored relative (e.g. /downloads/covers/x.png), meant to
  // resolve against the portal where it was uploaded — this page is served
  // from a different origin (GitHub Pages), so a bare relative src 404s here.
  if (!url) return '';
  return /^https?:\/\//i.test(url) ? url : 'https://portal.exergynet.org' + url;
}

function tagChips(tags, max) {
  return (tags || []).slice(0, max || 2).map(function(t) {
    return '<span class="journal-tag-chip">' + t + '</span>';
  }).join('');
}

function featuredCard(a) {
  var hasCover = !!a.cover_url;
  return '<a href="https://portal.exergynet.org/blog/' + a.slug + '" class="journal-featured-card' + (hasCover ? '' : ' no-cover') + '" target="_blank" rel="noopener">' +
    (hasCover ? '<div class="journal-featured-img"><img src="' + coverSrc(a.cover_url) + '" alt="' + esc(a.title) + '" loading="lazy"></div>' : '') +
    '<div class="journal-featured-body">' +
      '<div class="journal-tag-chips">' + tagChips(a.tags, 3) + '</div>' +
      '<h2 class="journal-featured-title">' + esc(a.title) + '</h2>' +
      (a.subtitle ? '<p class="journal-featured-sub">' + esc(a.subtitle) + '</p>' : '') +
      (a.excerpt ? '<p class="journal-featured-excerpt">' + esc(a.excerpt.slice(0, 160)) + '…</p>' : '') +
      '<div class="journal-byline">' +
        '<span>' + esc(a.author_name) + '</span>' +
        '<span class="journal-byline-dot">·</span>' +
        '<span>' + fmtDate(a.published_at) + '</span>' +
        '<span class="journal-byline-dot">·</span>' +
        '<span>' + a.reading_time_mins + ' min read</span>' +
      '</div>' +
    '</div>' +
  '</a>';
}

function articleCard(a) {
  var hasCover = !!a.cover_url;
  return '<a href="https://portal.exergynet.org/blog/' + a.slug + '" class="journal-card" target="_blank" rel="noopener">' +
    (hasCover
      ? '<div class="journal-card-img"><img src="' + coverSrc(a.cover_url) + '" alt="' + esc(a.title) + '" loading="lazy"></div>'
      : '<div class="journal-card-placeholder"><div class="journal-card-placeholder-icon">◈</div></div>'
    ) +
    '<div class="journal-card-body">' +
      '<div class="journal-tag-chips">' + tagChips(a.tags, 2) + '</div>' +
      '<h3 class="journal-card-title">' + esc(a.title) + '</h3>' +
      (a.excerpt ? '<p class="journal-card-excerpt">' + esc(a.excerpt.slice(0, 110)) + '…</p>' : '') +
      '<div class="journal-card-meta">' +
        '<span>' + fmtDate(a.published_at) + '</span>' +
        '<span class="journal-card-meta-dot">·</span>' +
        '<span>' + a.reading_time_mins + ' min</span>' +
      '</div>' +
    '</div>' +
  '</a>';
}

function esc(s) {
  if (!s) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderTags(tags) {
  var strip = document.getElementById('tag-strip');
  if (!strip) return;
  var existing = strip.querySelectorAll('[data-tag]:not([data-tag=""])');
  existing.forEach(function(el) { el.remove(); });
  tags.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'journal-tag-btn' + (state.tag === t ? ' active' : '');
    btn.setAttribute('data-tag', t);
    btn.textContent = t;
    btn.style.textTransform = 'capitalize';
    btn.onclick = function() { setTag(t); };
    strip.appendChild(btn);
  });
}

function setTag(t) {
  state.tag = t;
  document.querySelectorAll('#tag-strip .journal-tag-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.getAttribute('data-tag') === t);
  });
  load(true);
}

function renderArticles(reset) {
  var content = document.getElementById('journal-content');
  if (!content) return;

  if (state.articles.length === 0) {
    content.innerHTML = '<div class="journal-empty"><div class="journal-empty-icon">◈</div><p>No articles published yet.</p></div>';
    return;
  }

  // Sort client-side (production API ignores the sort param).
  var sorted = state.articles.slice().sort(function(a, b) {
    var da = new Date(a.published_at).getTime() || 0;
    var db = new Date(b.published_at).getTime() || 0;
    return state.sort === 'oldest' ? da - db : db - da;
  });
  var featured = sorted.filter(function(a) { return a.featured; });
  var rest     = sorted.filter(function(a) { return !a.featured; });

  var html = '';
  if (featured.length > 0) {
    html += '<div class="journal-featured">' + featuredCard(featured[0]) + '</div>';
    var gridItems = featured.slice(1).concat(rest);
    if (gridItems.length > 0) html += '<div class="journal-grid">' + gridItems.map(articleCard).join('') + '</div>';
  } else {
    html += '<div class="journal-grid">' + rest.map(articleCard).join('') + '</div>';
  }
  content.innerHTML = html;

  var lm = document.getElementById('loadmore-wrap');
  if (lm) lm.style.display = state.hasMore ? 'flex' : 'none';
}

// reset=true → fresh filter/sort change (replace results). reset=false → Load More (append).
function load(reset) {
  var content = document.getElementById('journal-content');
  if (reset !== false) reset = true;

  if (reset) {
    state.loaded = 0;
    state.articles = [];
    if (content) content.innerHTML = '<div class="journal-loading">loading articles…</div>';
  }

  // Production API supports tag + offset/limit only. Sort is applied client-side;
  // category filtering is not supported server-side, so no category param is sent.
  var qs = 'limit=' + PAGE_SIZE + '&offset=' + state.loaded;
  if (state.tag) qs += '&tag=' + encodeURIComponent(state.tag);

  fetch('https://portal.exergynet.org/api/blog/articles?' + qs)
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var articles = data.articles || [];
      state.articles = reset ? articles : state.articles.concat(articles);
      state.loaded = state.articles.length;
      state.total = data.total || 0;
      // Production API does not return has_more — derive it from the real total.
      state.hasMore = state.loaded < state.total;

      if (reset && !state.tag) {
        articles.forEach(function(a) { (a.tags || []).forEach(function(t) { knownTags.add(t); }); });
        renderTags(Array.from(knownTags));
      }

      renderArticles();
    })
    .catch(function(err) {
      if (content && reset) content.innerHTML = '<div class="journal-loading">Could not load articles. Check back soon.</div>';
      console.error('Journal fetch error:', err);
    });
}

// ── Controls ─────────────────────────────────────────────────────────────
document.getElementById('tag-strip').addEventListener('click', function(e) {
  if (e.target.getAttribute('data-tag') === '') setTag('');
});
document.getElementById('sort-select').addEventListener('change', function(e) {
  state.sort = e.target.value;
  renderArticles(); // client-side re-sort of already-loaded articles
});
document.getElementById('loadmore-btn').addEventListener('click', function() {
  load(false);
});

// ── Init ───────────────────────────────────────────────────────────────────
load(true);
</script>

<script src="main.js" defer></script>
</body>
</html>
