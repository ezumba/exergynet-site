<!-- authority 29 -> h=200 -->
<rect x="510" y="20" width="70" height="200"/>
<text x="545" y="235" font-size="10" text-anchor="middle">Authority (29/29)</text>
</g>
</g>

<text x="700" y="1550" text-anchor="middle" font-size="12" fill="#555">Source data: LNES84_3_VMN_SCALE_RESULTS.csv, LNES84_3_VMN_CONCURRENCY_RESULTS.csv,</text>
<text x="700" y="1568" text-anchor="middle" font-size="12" fill="#555">LNES84_3_VMN_MUTATION_RESULTS.json, LNES84_3_VMN_FAILURE_INJECTION_RESULTS.json,</text>
<text x="700" y="1586" text-anchor="middle" font-size="12" fill="#555">LNES84_3_VMN_RESTART_RESULTS.json, LNES84_3_VMN_REBUILD_RESULTS.json, LNES84_3_AUTHORITY_SEPARATION_RESULTS.json</text>
</svg>
