<svg viewBox="0 0 1400 1700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="1400" height="1700" fill="#ffffff"/>
<text x="700" y="30" text-anchor="middle" font-size="20" font-weight="bold">LNES-84.3 Phases 8-17 -- VMN Production-Substrate Validation Charts</text>
<text x="700" y="50" text-anchor="middle" font-size="12" fill="#555">All values real, measured. Isolated sandbox only. Prepared 2026-08-17.</text>

<!-- Panel 1: Scale latency (single-document chunk scaling, log-scale bars) -->
<text x="40" y="90" font-size="15" font-weight="bold">Panel 1 -- Scale Latency: Arm A vs Arm B, single-document chunk scaling (median ms)</text>
<text x="40" y="107" font-size="11" fill="#555">document_size_sweep.json (reused, original sprint) -- speedup grows with chunk count: 1.18x at 3 chunks -&gt; 8.77x at 849 chunks</text>
<g transform="translate(60,130)">
<!-- axes -->
<line x1="0" y1="220" x2="1300" y2="220" stroke="#333"/>
<line x1="0" y1="0" x2="0" y2="220" stroke="#333"/>
<text x="-10" y="15" font-size="10" text-anchor="end">300ms</text>
<text x="-10" y="115" font-size="10" text-anchor="end">30ms</text>
<text x="-10" y="220" font-size="10" text-anchor="end">0ms</text>
<!-- bars: 6 size classes, A and B side by side, log-ish scale capped visually via sqrt for readability -->
<!-- using sqrt scale: height = 220 * sqrt(value/300) -->
<!-- 5KB: A=1.765 B=1.594 -->
<g transform="translate(20,0)">
<rect x="0" y="204" width="30" height="16" fill="#4a7ebb"/>
<rect x="34" y="205" width="30" height="15" fill="#e07b39"/>
<text x="32" y="235" font-size="10" text-anchor="middle">5KB</text>
</g>
<!-- 20KB: A=3.399 B=1.726 -->
<g transform="translate(120,0)">
<rect x="0" y="197" width="30" height="23" fill="#4a7ebb"/>
<rect x="34" y="205" width="30" height="15" fill="#e07b39"/>
<text x="32" y="235" font-size="10" text-anchor="middle">20KB</text>
</g>
<!-- 50KB: A=6.260 B=2.558 -->
<g transform="translate(220,0)">
<rect x="0" y="185" width="30" height="35" fill="#4a7ebb"/>
<rect x="34" y="200" width="30" height="20" fill="#e07b39"/>
<text x="32" y="235" font-size="10" text-anchor="middle">50KB</text>
</g>
<!-- 150KB: A=16.373 B=4.129 -->
<g transform="translate(320,0)">
<rect x="0" y="150" width="30" height="70" fill="#4a7ebb"/>
<rect x="34" y="193" width="30" height="27" fill="#e07b39"/>
<text x="30" y="235" font-size="10" text-anchor="middle">150KB</text>
</g>
<!-- 500KB: A=46.797 B=10.060 -->
<g transform="translate(420,0)">
<rect x="0" y="90" width="30" height="130" fill="#4a7ebb"/>
<rect x="34" y="170" width="30" height="50" fill="#e07b39"/>
<text x="30" y="235" font-size="10" text-anchor="middle">500KB</text>
</g>
<!-- 1.5MB: A=295.151 B=33.661 -->
<g transform="translate(520,0)">
<rect x="0" y="2" width="30" height="218" fill="#4a7ebb"/>
<rect x="34" y="130" width="30" height="90" fill="#e07b39"/>
<text x="28" y="235" font-size="10" text-anchor="middle">1.5MB</text>
</g>
<rect x="650" y="0" width="14" height="14" fill="#4a7ebb"/><text x="670" y="12" font-size="11">Arm A (retrieve_evidence)</text>
<rect x="650" y="20" width="14" height="14" fill="#e07b39"/><text x="670" y="32" font-size="11">Arm B (retrieve_evidence_compact)</text>
<text x="650" y="55" font-size="10" fill="#555">bar heights not linear -- see</text>
<text x="650" y="68" font-size="10" fill="#555">LNES84_3_VMN_SCALE_RESULTS.csv for exact ms</text>
</g>

<!-- Panel 2: 10MB vault workload-dependent finding -->
<text x="40" y="410" font-size="15" font-weight="bold">Panel 2 -- 10MB Vault: Aggregate vs Per-Document-Type Speedup (Arm A / Arm B, median)</text>
<text x="40" y="427" font-size="11" fill="#555">correctness_latency_10MB.json, 77 queries x 3 reps = 231 paired records. Speedup &lt; 1.0 means Arm B is SLOWER.</text>
<g transform="translate(60,450)">
<line x1="0" y1="150" x2="700" y2="150" stroke="#333"/>
<line x1="0" y1="0" x2="0" y2="150" stroke="#333"/>
<!-- 1.0x reference line at height for value=1.0 out of max 2.5 scale -> y = 150 - (1.0/2.5)*150 = 90 -->
<line x1="0" y1="90" x2="700" y2="90" stroke="#999" stroke-dasharray="4,4"/>
<text x="705" y="94" font-size="10" fill="#999">1.0x (parity)</text>
<!-- ALL: 0.72x -> y = 150-(0.72/2.5)*150=106.8 height=150-106.8=43.2 -->
<rect x="60" y="106.8" width="80" height="43.2" fill="#888"/>
<text x="100" y="167" font-size="11" text-anchor="middle">ALL (0.72x)</text>
<!-- ENTITY: 0.69x -> y=150-(0.69/2.5)*150=108.6 h=41.4 -->
<rect x="250" y="108.6" width="80" height="41.4" fill="#c0392b"/>
<text x="290" y="167" font-size="11" text-anchor="middle">ENTITY 84% (0.69x)</text>
<!-- FILLER: 2.28x -> y=150-(2.28/2.5)*150=13.2 h=136.8 -->
<rect x="440" y="13.2" width="80" height="136.8" fill="#27ae60"/>
<text x="480" y="167" font-size="11" text-anchor="middle">FILLER 16% (2.28x)</text>
</g>

<!-- Panel 3: Concurrency throughput + latency -->
<text x="40" y="670" font-size="15" font-weight="bold">Panel 3 -- Concurrency: Throughput and Latency (C=1,2,4,8,16)</text>
<text x="40" y="687" font-size="11" fill="#555">concurrency_results.json (reused, original sprint). error_rate=0, incorrect_rate=0 at every level.</text>
<g transform="translate(60,710)">
<line x1="0" y1="200" x2="600" y2="200" stroke="#333"/>
<line x1="0" y1="0" x2="0" y2="200" stroke="#333"/>
<text x="-10" y="5" font-size="10" text-anchor="end">1000/s</text>
<text x="-10" y="200" font-size="10" text-anchor="end">0/s</text>
<!-- throughput bars: max 952.4 -> scale 200/1000 -->
<g fill="#4a7ebb">
<rect x="30" y="157" width="60" height="43"/>
<rect x="140" y="86" width="60" height="114"/>
<rect x="250" y="58" width="60" height="142"/>
<rect x="360" y="15" width="60" height="185"/>
<rect x="470" y="10" width="60" height="190"/>
</g>
<text x="60" y="220" font-size="11" text-anchor="middle">C=1</text>
<text x="170" y="220" font-size="11" text-anchor="middle">C=2</text>
<text x="280" y="220" font-size="11" text-anchor="middle">C=4</text>
<text x="390" y="220" font-size="11" text-anchor="middle">C=8</text>
<text x="500" y="220" font-size="11" text-anchor="middle">C=16</text>
<text x="60" y="152" font-size="9" text-anchor="middle">214.6</text>
<text x="170" y="81" font-size="9" text-anchor="middle">568.2</text>
<text x="280" y="53" font-size="9" text-anchor="middle">706.7</text>
<text x="390" y="10" font-size="9" text-anchor="middle">925.9</text>
<text x="500" y="5" font-size="9" text-anchor="middle">952.4</text>
<text x="0" y="245" font-size="11" fill="#555">reads/sec throughput (sub-linear scaling past C=4, no errors)</text>
</g>

<!-- Panel 4: CPU/RSS by concurrency -->
<text x="40" y="990" font-size="15" font-weight="bold">Panel 4 -- Memory RSS after test, by concurrency level</text>
<g transform="translate(60,1010)">
<line x1="0" y1="150" x2="600" y2="150" stroke="#333"/>
<line x1="0" y1="0" x2="0" y2="150" stroke="#333"/>
<text x="-10" y="5" font-size="10" text-anchor="end">260MB</text>
<text x="-10" y="150" font-size="10" text-anchor="end">0MB</text>
<g fill="#8e44ad">
<rect x="30" y="99.4" width="60" height="50.6"/>
<rect x="140" y="90.3" width="60" height="59.7"/>
<rect x="250" y="75.4" width="60" height="74.6"/>
<rect x="360" y="41.7" width="60" height="108.3"/>
<rect x="470" y="6.0" width="60" height="144.0"/>
</g>
<text x="60" y="170" font-size="11" text-anchor="middle">C=1 (87.7MB)</text>
<text x="170" y="170" font-size="11" text-anchor="middle">C=2 (103.4MB)</text>
<text x="280" y="170" font-size="11" text-anchor="middle">C=4 (129.2MB)</text>
<text x="390" y="170" font-size="11" text-anchor="middle">C=8 (187.6MB)</text>
<text x="500" y="170" font-size="11" text-anchor="middle">C=16 (249.7MB)</text>
</g>

<!-- Panel 5: Mutation/failure-injection/restart/rebuild/authority outcomes -->
<text x="40" y="1230" font-size="15" font-weight="bold">Panel 5 -- Correctness/Robustness Outcomes, All Phases (Phase 8-16)</text>
<text x="40" y="1247" font-size="11" fill="#555">Every bar is a real check count. All PASS -- zero failures across 61 checks total.</text>
<g transform="translate(60,1270)">
<line x1="0" y1="220" x2="900" y2="220" stroke="#333"/>
<line x1="0" y1="0" x2="0" y2="220" stroke="#333"/>
<!-- scale: max 29 -> 200px -->
<g fill="#27ae60">
<rect x="30" y="220" width="70" height="0"/>
<!-- mutation 22 -> h=151.7 -->
<rect x="30" y="68.3" width="70" height="151.7"/>
